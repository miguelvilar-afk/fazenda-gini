<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel administrativo — Três Porquinhos</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22" fill="#D98B8B"/><ellipse cx="32" cy="38" rx="10" ry="7" fill="#C97272"/><circle cx="27" cy="37" r="1.6" fill="#5C3A3A"/><circle cx="37" cy="37" r="1.6" fill="#5C3A3A"/></svg>
      <span>Três Porquinhos</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="#" onclick="logout();return false;">Sair</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container" id="admin-area">
    <p>Verificando permissão...</p>
  </div>
</section>

<footer>
  Fazenda Três Porquinhos — site criado para fins de estudo de segurança web.
</footer>

<script src="js/app.js"></script>
<script>
  // Esta checagem roda inteiramente no navegador da pessoa visitante.
  // Isso significa que ela pode ser alterada ou ignorada por qualquer um
  // que abra o console do navegador - não existe backend conferindo nada.
  function carregarAdmin() {
    const area = document.getElementById('admin-area');

    if (!isAdminSession()) {
      area.innerHTML = '<p>Acesso restrito. Esta área é só para administradores.</p>';
      return;
    }

    const usuarios = getAllUsers();
    const linhas = usuarios.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.nome}</td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td>${u.password}</td>
        <td>${u.role}</td>
      </tr>
    `).join('');

    area.innerHTML = `
      <h1>Painel administrativo</h1>
      <p style="color:var(--ink-soft)">Todos os usuários cadastrados na granja.</p>
      <!-- lembrete: nunca deveríamos listar a senha de ninguém aqui -->
      <table class="data-table">
        <thead>
          <tr><th>ID</th><th>Nome</th><th>Usuário</th><th>E-mail</th><th>Senha</th><th>Tipo</th></tr>
        </thead>
        <tbody>${linhas}</tbody>
      </table>
    `;
  }
  document.addEventListener('DOMContentLoaded', carregarAdmin);
</script>
</body>
</html>
